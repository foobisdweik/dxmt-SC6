# Override PCI vendor and device IDs reported to the application. Can
# cause the app to adjust behaviour depending on the selected values.
#
# Supported values: Any four-digit hex number.

# dxgi.customDeviceId = 0000
# dxgi.customVendorId = 0000


# Override the reported device description
#
# Supported values: Any string.

# dxgi.customDeviceDesc = ""


# Force to report a SDR display, in case of unintended behavior in HDR mode
# This option only affects DXGI, and does not change what games see through nvapi
# Setting to False does not imply the display will be reported as HDR
#
# Supported values: True, False 

# dxgi.forceSDR = False


# Enables frame rate limiter.
# The frame pacing is coordinated by Metal (w/ CoreAnimation)
# rather than simulated on CPU. Thus you will get a beautiful straight
# line for the frames time graph. However, the system may not provide
# the frame rate you'd requested, for example, you would get 30Hz if
# you request 40Hz on a 60Hz monitor.
#
# Supported values: Any non-negative integer, preferably a factor of 
# the monitor refresh rate

# d3d11.preferredMaxFrameRate = 60

# Adjust MetalFX Sptial Upscaling factor.
# It is multiplied by source output width & height to get the
# final output resolution. 
# e.g. To get 1440p from 1080p you only need a factor of 1.33
#
# MetalFX spatial upscaling must be turned on for this to take effect, with
# d3d11.metalSpatialUpscale below or the `MULLION_METALFX_SPATIAL_SWAPCHAIN=1`
# environment variable.
#
# Supported values: Any number greater than 1.0

# d3d11.metalSpatialUpscaleFactor = 2.0

# Upscale D3D10/11 swapchains with MetalFX spatial upscaling, as
# `MULLION_METALFX_SPATIAL_SWAPCHAIN=1` does.
#
# Supported values: True, False

# d3d11.metalSpatialUpscale = False

# SC6 fork: sets `displaySyncEnabled` on the CAMetalLayer of the swapchain.
# When False, presentation does not wait for the display refresh, and
# frame pacing relies on `d3d11.preferredMaxFrameRate` only.
# When True, each frame is shown at a display refresh, which may avoid
# tearing at the cost of extra latency.
#
# Supported values: True, False

# dxgi.metalDisplaySync = False

# SC6 fork: puts a borderless window that covers the whole screen into native
# macOS fullscreen (its own Space). Wine's Mac driver only does this for
# resizable windows. In native fullscreen, macOS can show the frames directly
# instead of compositing them. Mullion tries at most 3 times per process, so
# leaving fullscreen by hand (for example with Ctrl-Cmd-F) sticks after that.
#
# Supported values: True, False
#
# Enabled by default for:
# - SoulcaliburVI.exe

# dxgi.nativeFullscreen = False

# SC6 fork: treats every swapchain as if it lacked ALLOW_MODE_SWITCH.
# Fullscreen then keeps the desktop's display mode and only covers the screen
# with the window, so a back buffer smaller than the screen reaches MetalFX
# instead of making Wine switch the whole display to that size.
#
# Supported values: True, False

# dxgi.keepDesktopMode = False

# SC6 fork: pixel format of the Metal layer that SDR frames are presented to.
# macOS can show a layer directly (no window-server compositing) only in a
# format the display scans out. Games with an R10G10B10A2 swapchain get an
# RGB10A2 layer, which is always composited; bgr10a2 keeps 10 bits per channel
# and allows direct presentation. "auto" uses the swapchain's format. HDR
# output ignores this option, because a unorm layer cannot hold values above
# SDR white.
#
# Supported values: auto, bgra8, bgr10a2
#
# bgr10a2 by default for:
# - SoulcaliburVI.exe

# dxgi.metalLayerPixelFormat = auto

# SC6 fork: keeps a Metal pipeline archive (MTLBinaryArchive) and a list of
# compiled pipelines next to the shader cache, in mullion/<exe>/pso_archive_*.bin
# and pso_list_*.bin under $(getconf DARWIN_USER_CACHE_DIR).
# A pipeline found in the archive loads without a GPU compile. At the next
# launch, each listed pipeline is compiled in the background as soon as the
# game has created its shaders, so the first draw that uses it is less
# likely to wait. The files are written when no pipeline was added for a few
# seconds, and at device teardown. Has no effect if MULLION_SHADER_CACHE=0.
#
# Supported values: True, False
#
# Enabled by default for:
# - SoulcaliburVI.exe

# d3d11.pipelineArchive = False

# Ignore D3D11_MAP_FLAG_DO_NOT_WAIT flag when D3D11DeviceContext::Map() is
# called, in case the game uses this flag without properly handling an error
# of `DXGI_ERROR_WAS_STILL_DRAWING` returned.
#
# Supported values: True, False
#
# Enabled by default for:
# - Sonic X Shadow Generations

# d3d11.ignoreMapFlagNoWait = False

# Set Metal version of converted shaders
# - 310 : Metal 3.1, supported by macOS 14 Sonoma and above
# - 320 : Metal 3.2, supported by macOS 15 Sequoia and above
# If not specified or specified version is not supported, then use the latest
# version supported by current system.
#
# Supported values: 310, 320

# mullion.shaderMetalVersion = 310

# Let Mullion handle alt(cmd)+tab in fullscreen exclusive mode
# A native DXGI should handle it by default, but it's not feasible to implement this
# properly in Wine.
#
# Some games handle this by themselves, in that case you can ignore this option.
#
# Supported values: True, False 

# dxgi.handleAltTab = False

# Sanitize NaN sample coordinates to zero. This is an UB anyway, just less broken.
#
# Supported values: True, False
#

# d3d11.sampleNaNToZero = False

# Split `fma()` into a multiplication and an addition.
#
# Supported values: True, False
#

# d3d11.defuseFma = False

# Override the maximum feature level of created d3d11 device.
#
# Supported values: 9_1, 9_2, 9_3, 10_0, 10_1, 11_0, 11_1, 12_0, 12_1

# d3d11.maxFeatureLevel = 12_1

# Overrides the maximum allowed tessellation factor. This can be used to
# improve performance in titles which overuse tessellation.
#
# Supported values: Any integer between 4 and 64

# d3d11.maxTessFactor = 64

# SC6 fork: turns off one of Mullion's paths, to compare the GPU cost and the
# output with and without it. Every path is on by default. Each option below
# turns off one path with False:
#
#   mullion.cbufferBounds      rows past a constant buffer's size read zeros
#   mullion.fracFloor          frc as src - floor(src), in place of a select
#   mullion.sampleBranchMerge  one sample for the branches of a sampling branch
#   mullion.minmaxBranchMerge  the same, for minimum and maximum filters
#   mullion.groupSyncFence     a device fence at group syncs (before Apple9)
#   mullion.gsLayered          layered geometry shaders run in the vertex function
#   mullion.pipelineArchive    the pipeline archive and its warm-up
#
# mullion.disable takes a comma-separated list of path names (cbuffer-bounds,
# frac-floor, sample-branch-merge, minmax-branch-merge, group-sync-fence,
# gs-layered, pipeline-archive), or all. The environment variable
# MULLION_SC6_DISABLE (or DXMT_SC6_DISABLE) takes the same list. A path is off
# when any of them turns it off. The log says which paths are off.
#
# Supported values: True, False (the lists: path names, or all)

# mullion.cbufferBounds = True
# mullion.disable = ""
